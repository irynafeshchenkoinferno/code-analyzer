syntax = "proto3";

package ai;

service AiAgentService {
  rpc GetResponse(AiRequest) returns (AiResponse);

  rpc StreamAnalyze (stream FileData) returns (AnalyzeProjectResponse);
}

message AiRequest {
  string prompt = 1;
}

message AiResponse {
  string text = 1;
}

message FileData {
  string path = 1;
  string name = 2;
  string content = 3;
}

message AnalyzeProjectResponse {
  string summary = 1;
  int32 fileCount = 2;
}
