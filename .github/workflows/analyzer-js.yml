name: Analyze Code with AI Agent

on:
  push:
    branches:
      - 'feature/**'
      - 'master'
  pull_request:
    branches:
      - 'feature/**'
      - 'master'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run AI Analysis
        run: |
          node dist/client.js
